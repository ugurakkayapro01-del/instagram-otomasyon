name: Günlük Instagram Carousel

# Günde 2 kez otomatik çalışır (UTC saatleri — İstanbul UTC+3):
#   07:00 UTC -> 10:00 İstanbul
#   16:00 UTC -> 19:00 İstanbul
# workflow_dispatch: GitHub'ın Actions sekmesinden elle de tetiklenebilir
# (ilk test çalıştırması için önerilir — cron'a güvenmeden önce).
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

# id-token: Anthropic Workload Identity Federation için GitHub OIDC token'ı almaya yarar.
# contents: write — üretilen görselleri ve güncellenmiş konu listelerini push edebilmek için.
# issues: write — hata durumunda otomatik bir Issue açabilmek için.
permissions:
  id-token: write
  contents: write
  issues: write

# Aynı workflow'un üst üste/paralel çalışmasını engeller (çift yayın koruması).
concurrency:
  group: daily-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install anthropic playwright
          playwright install --with-deps chromium

      - name: Anthropic WIF kimlik token'ını al
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            fs.writeFileSync('/tmp/gha-jwt', token);

      - name: İçerik üret (Claude, WIF ile — statik API key YOK)
        working-directory: scripts
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
        run: python generate_carousel.py

      - name: HTML oluştur (deterministik şablonlama)
        working-directory: scripts
        run: python build_html.py

      - name: JPEG slaytları export et (Playwright)
        working-directory: scripts
        run: python export_jpeg.py

      - name: Konu listelerini güncelle
        working-directory: scripts
        run: python update_topics.py

      - name: Üretilen dosyaları commit + push et
        run: |
          git config user.name "carousel-automation"
          git config user.email "actions@users.noreply.github.com"
          git add output/ content/topics_used.md content/topics_backlog.md state/current_carousel.json state/build_meta.json
          git commit -m "Otomatik carousel: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Commit edilecek değişiklik yok"
          git push

      - name: Görsel URL'lerini doğrula (yayından önce erişilebilirlik kontrolü)
        working-directory: scripts
        run: python verify_urls.py

      - name: Instagram'da yayınla
        working-directory: scripts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python run_publish.py

      - name: Yayın sonucunu (state/last_run.json) commit et
        if: always()
        run: |
          git config user.name "carousel-automation"
          git config user.email "actions@users.noreply.github.com"
          git add state/last_run.json state/hosted_urls.json 2>/dev/null || true
          git commit -m "Yayın durumu kaydı: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Commit edilecek değişiklik yok"
          git push || echo "Push edilecek değişiklik yok"

      - name: Hata durumunda Issue aç
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Carousel otomasyonu başarısız oldu — ${new Date().toISOString().slice(0,10)}`,
              body: `Bu çalıştırma başarısız oldu. Detaylı log için:\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nHiçbir secret/token bilgisi bu Issue'da yer almaz.`,
              labels: ["automation-failure"],
            });
